[package]
name = "game"
version.workspace = true
edition.workspace = true
description = "The game client: window, renderer, input, HUD and audio."

[[bin]]
name = "mine-clone"
path = "src/main.rs"

[dependencies]
voxel = { path = "../voxel" }
net = { path = "../net" }
glam.workspace = true
bytemuck.workspace = true
serde.workspace = true
ron.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
wgpu = "24"
winit = "0.30"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
rodio = { version = "0.20", default-features = false, features = ["vorbis", "mp3", "wav", "flac"] }
font8x8 = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
env_logger = "0.11"
gilrs = "0.11"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "component"] }
nvml-wrapper = "0.13"
# Opus for voice chat (libopus, built from source with CMake).
opus-head-sys = { version = "0.3.3", default-features = false }
wasmi = { version = "2.0.0", default-features = false, features = ["std", "wat", "validate", "portable-dispatch"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Performance"] }
hidapi = { version = "2", default-features = false, features = ["windows-native"] }

[target.'cfg(not(windows))'.dependencies]
hidapi = "2"
