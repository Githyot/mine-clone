[workspace]
resolver = "2"
members = ["crates/voxel", "crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.16", features = ["derive"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
lz4_flex = "0.11"
crossbeam-channel = "0.5"
log = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Fast iteration builds that are still quick enough to play.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
